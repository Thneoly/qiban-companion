[workspace]
members = [
    "crates/companion-core",
    "crates/companion-storage",
    "apps/desktop/src-tauri",
    "apps/memory-service",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
companion-core = { path = "crates/companion-core" }
companion-storage = { path = "crates/companion-storage" }
