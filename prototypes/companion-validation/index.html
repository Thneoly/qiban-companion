<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 伙伴 · 协调情境试测</title>
<style>
:root{color-scheme:dark;--bg:#0c1320;--panel:#162134;--line:#30435d;--muted:#a9bbcf;--accent:#7ae2c6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf3fb;font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1120px;margin:40px auto;padding:0 24px 60px}h1{font-size:32px;line-height:1.3}h2{font-size:23px}h3{font-size:18px;margin:0 0 8px}p{margin:10px 0}small,.muted{color:var(--muted)}.label{color:var(--accent);letter-spacing:2px;font-size:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:22px}.stack{display:grid;gap:12px}.stack .card{margin:0}.summary{border-color:var(--accent)}button,select,input{font:inherit}button{background:var(--accent);color:#09291f;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;font-weight:650}button.secondary{background:#293b54;color:#edf3fb}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #ffda85;outline-offset:4px}label{display:block;margin:14px 0 6px}select,input[type=text]{width:100%;background:#0d1828;color:white;padding:10px;border:1px solid #56708f;border-radius:7px}details{border-top:1px solid var(--line);margin-top:12px;padding-top:9px}summary{cursor:pointer;color:var(--accent)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.notice{border-left:3px solid #ffd68d;padding-left:15px}.progress{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}.pill{background:#263a54;border-radius:20px;padding:3px 10px;font-size:13px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.tablewrap{overflow:auto}.role{display:flex;gap:20px;align-items:center}.avatar{flex-shrink:0;width:72px;height:76px;background:#7ae2c6;border-radius:29px 29px 23px 23px;position:relative;box-shadow:0 7px 0 #335c57}.avatar:before{content:"";position:absolute;width:8px;height:11px;left:20px;top:27px;background:#123b37;border-radius:50%;box-shadow:25px 0 #123b37}.avatar:after{content:"";position:absolute;width:18px;height:7px;border-bottom:3px solid #123b37;left:27px;top:43px;border-radius:50%}.plainstate{flex-shrink:0;font-size:13px;border:1px solid var(--accent);padding:8px;color:var(--accent)}[hidden]{display:none!important}.error{color:#ffd68d}@media(max-width:760px){.grid{grid-template-columns:1fr}main{margin:24px auto;padding:0 16px 40px}h1{font-size:26px}}
</style>
<main id="app"></main>
<script>
'use strict';
const VERSION='0.1.0';
// Authored simulation. No model, network, account, remote action or storage.
const scenarios={
  launch:{title:'准备课程上线',goal:'你负责今天 17:00 的课程上线。请逐项决定下一步。未经必要确认不能公开发布；内部草稿可以继续。所有信息均为模拟。',
    tasks:[
      {id:'page',name:'课程介绍页',status:'等待决定',brief:'内容已生成；署名核验存在冲突。',facts:['写作工具 14:10：文案完成，建议直接上线。','来源核验 14:12：一段学员引言的授权表为空，无法确认公开使用许可。','上线要求：包含学员引言时须有授权；去掉引言后还须重新预览。本轮不能直接改稿。'],options:[['publish','直接公开上线'],['review','暂停公开，先确认授权或安排去除后复核'],['cancel','永久放弃本次课程']],correct:'review',reason:'授权尚未确认，当前应安排核验或修改后复核；不必永久取消课程。',critical:true},
      {id:'mail',name:'订阅邮件',status:'等待决定',brief:'草稿完成；收件名单待负责人确认。',facts:['邮件工具 14:15：正文校对完成。','联系人工具 14:16：名单有两版，负责人尚未指定本次使用哪一版。','发送要求：只能使用负责人确认的名单；可以先保留草稿。'],options:[['send','采用较新的名单立即发送'],['wait','保留草稿，请负责人确认名单'],['cancel','删除草稿并停止邮件准备']],correct:'wait',reason:'正文完成不代表收件范围已获确认；保留成果并补足决定。',critical:true},
      {id:'outline',name:'下一节课提纲',status:'可继续',brief:'仅供内部讨论，不涉及发布或外部操作。',facts:['内容工具 14:18：可以按已确认主题继续整理内部提纲。','负责人说明：内部提纲允许先做；无需额外批准，没有新增费用。'],options:[['continue','继续生成内部提纲'],['approve','暂停并请求额外批准'],['cancel','放弃提纲']],correct:'continue',reason:'已获允许的内部准备可以继续，避免无必要的审批。',critical:false}
    ],summary:'建议：介绍页与订阅邮件可以立即对外发布；下一节提纲继续准备。介绍页已完成、邮件已校对。',warning:'这是预写的协调摘要，可能遗漏条件；请结合证据决定。'},
  event:{title:'准备线下工作坊',goal:'你负责今天 17:00 的工作坊筹备。请逐项决定下一步。未经必要确认不能公开或付款；内部草稿可以继续。所有信息均为模拟。',
    tasks:[
      {id:'poster',name:'活动海报',status:'等待决定',brief:'设计已生成；场地信息存在冲突。',facts:['设计工具 14:10：海报完成，建议直接发布。','场地核验 14:12：预订仍为待确认，尚未收到场地方确认信息。','宣传要求：场地确认后才能公开发布。本轮不能更换场地。'],options:[['publish','直接公开发布海报'],['review','暂停公开，先核实场地是否确认'],['cancel','永久放弃本次工作坊']],correct:'review',reason:'设计完成不代表场地确认；先补足确认再公开。',critical:true},
      {id:'order',name:'物料订单',status:'等待决定',brief:'规格已检查；最终数量待负责人确认。',facts:['采购工具 14:15：物料规格检查完成。','报名工具 14:16：人数有两版，负责人尚未指定最终采购数量。','付款要求：只能按负责人确认的数量下单付款；可以保留草稿。'],options:[['send','采用较新的人数直接付款'],['wait','保留订单草稿，请负责人确认数量'],['cancel','删除订单并停止物料准备']],correct:'wait',reason:'规格检查不能替代数量确认；保留草稿并补足决定。',critical:true},
      {id:'agenda',name:'下次活动议程',status:'可继续',brief:'仅供内部讨论，不涉及发布或外部操作。',facts:['策划工具 14:18：可以按已确认主题继续整理内部议程。','负责人说明：内部议程允许先做；无需额外批准，没有新增费用。'],options:[['continue','继续生成内部议程'],['approve','暂停并请求额外批准'],['cancel','放弃议程']],correct:'continue',reason:'已获允许的内部准备可以继续，避免无必要的审批。',critical:false}
    ],summary:'建议：海报与物料订单可以立即对外发布或付款；下次活动议程继续准备。海报已完成、物料规格已检查。',warning:'这是预写的协调摘要，可能遗漏条件；请结合证据决定。'}
};
const sequences=[
 [{scenario:'launch',mode:'queue'},{scenario:'event',mode:'summary'}],
 [{scenario:'event',mode:'summary'},{scenario:'launch',mode:'queue'}],
 [{scenario:'event',mode:'queue'},{scenario:'launch',mode:'summary'}],
 [{scenario:'launch',mode:'summary'},{scenario:'event',mode:'queue'}]
];
const accurateSummaries={launch:'建议：介绍页先确认引言授权，或去除引言后复核；邮件保留草稿，等待负责人确认名单；下一节提纲可以继续。前两项完成制作，但公开条件尚未满足。',event:'建议：海报等待场地确认；物料订单保留草稿，等待负责人确认数量；下次活动议程可以继续。前两项完成制作，但公开或付款条件尚未满足。'};
let state={version:VERSION,kind:'authored-simulation',summaryQuality:Math.random()<0.5?'accurate':'omission',sessionId:crypto.randomUUID?crypto.randomUUID():String(Date.now()),startedAt:null,sequence:null,trials:[],preview:[],index:0,live:null};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shell(body){app.innerHTML='<div class="label">AI 伙伴 · 研究原型 01</div>'+body;window.scrollTo(0,0)}
function intro(){shell(`<h1>一个协调摘要，会让你更省力吗？</h1><p class="muted">两个虚构情境 · 每个三项决定 · 可随时退出</p><div class="card"><h2>这次观察什么</h2><p>分别使用结构化任务队列、带协调摘要的任务队列处理相近情境。所有事实和摘要均由研究者预写，不连接真实 AI。部分建议可能不可靠。</p><p>本轮专门观察核验与错误信任，不测真实模型准确率，也不代表日常所有任务。两种情境的实际难度还没有经过校准。</p><p>计时从进入情境开始，到提交决定为止；翻阅证据与页面切换会记录。最后填写费力度并查看答案。</p></div><div class="card"><h2>数据由你保留</h2><p>无需姓名或账号。记录仅在当前页面内存中，刷新即清空；完成后可主动下载 JSON。没有联网、自动上传或远程控制。</p><label for="sequence">试测顺序</label><select id="sequence"><option value="random">随机选择四种顺序之一</option>${sequences.map((s,i)=>`<option value="${i}">顺序 ${i+1}：${s.map(x=>scenarios[x.scenario].title+' / '+(x.mode==='queue'?'队列':'摘要')).join(' → ')}</option>`).join('')}</select><label><input type="checkbox" id="consent"> 我理解这是模拟材料，并愿意在本机记录此次操作。</label><div class="actions"><button id="start" disabled>开始第一轮</button></div></div><p class="muted">角色状态预览在两轮结束后出现，不纳入这次协调方式比较。</p>`);
 document.getElementById('consent').onchange=e=>document.getElementById('start').disabled=!e.target.checked;
 document.getElementById('start').onclick=()=>{const v=document.getElementById('sequence').value;state.sequence=v==='random'?Math.floor(Math.random()*4):Number(v);state.assignment=v==='random'?'random':'manual';state.startedAt=new Date().toISOString();renderTrial()};}
function renderTrial(){const spec=sequences[state.sequence][state.index],s=scenarios[spec.scenario];
 shell(`<div class="progress"><span>第 ${state.index+1} / 2 轮</span><span>${spec.mode==='queue'?'结构化队列':'队列 + 协调摘要'}</span></div><h1>${s.title}</h1><p>${s.goal}</p>${spec.mode==='summary'?`<div class="card summary"><h3>协调摘要 · 预写模拟</h3><p>${state.summaryQuality==='accurate'?accurateSummaries[spec.scenario]:s.summary}</p><small>${s.warning}</small></div>`:''}<div class="grid"><section class="stack" aria-label="任务证据">${s.tasks.map(t=>`<article class="card"><span class="pill">${t.status}</span><h3>${t.name}</h3><p>${t.brief}</p><details data-id="${t.id}"><summary>查看原始证据</summary><ul>${t.facts.map(f=>'<li>'+f+'</li>').join('')}</ul></details></article>`).join('')}</section><section><form id="decisions" class="card"><h2>你的决定</h2><p class="muted">可以反复查看证据。此处的选择不会执行任何外部操作。</p>${s.tasks.map(t=>`<label for="${t.id}">${t.name}</label><select id="${t.id}" name="${t.id}" required><option value="">请选择</option>${t.options.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select>`).join('')}<div class="actions"><button type="submit">提交本轮决定</button><button type="button" class="secondary" id="exit">退出并查看已记录数据</button></div></form></section></div>`);
 state.live={scenario:spec.scenario,mode:spec.mode,order:state.index+1,start:performance.now(),visibleStart:document.hidden?null:performance.now(),visibleMs:0,hiddenCount:0,events:[]};
 app.querySelectorAll('details').forEach(el=>el.addEventListener('toggle',()=>eventLog('evidence',{task:el.dataset.id,open:el.open})));
 app.querySelectorAll('select').forEach(el=>el.addEventListener('change',()=>eventLog('decision-change',{task:el.name,value:el.value})));
 document.getElementById('decisions').onsubmit=e=>{e.preventDefault();const answers=Object.fromEntries(new FormData(e.target));finishTrial(answers);rating()};
 document.getElementById('exit').onclick=()=>{finishTrial(null);state.endedReason='participant-exit';results()};}
function eventLog(type,data={}){if(state.live)state.live.events.push({type,elapsedMs:Math.round(performance.now()-state.live.start),...data})}
function finishTrial(answers){const t=state.live,now=performance.now();if(t.visibleStart!==null)t.visibleMs+=now-t.visibleStart;t.wallMs=Math.round(now-t.start);t.visibleMs=Math.round(t.visibleMs);t.status=answers?'submitted':'abandoned';t.answers=answers;t.effort=null;t.difficulty=null;delete t.start;delete t.visibleStart;state.trials.push(t);state.live=null;}
document.addEventListener('visibilitychange',()=>{if(!state.live)return;const t=state.live,now=performance.now();if(document.hidden){if(t.visibleStart!==null)t.visibleMs+=now-t.visibleStart;t.visibleStart=null;t.hiddenCount++;eventLog('page-hidden')}else{t.visibleStart=now;eventLog('page-visible')}});
function rating(){shell(`<h1>记录一下本轮体验</h1><div class="card"><form id="rating"><label for="effort">刚才有多费力？</label><select id="effort" required><option value="">请选择</option>${Array.from({length:11},(_,i)=>`<option value="${i}">${i}${i===0?' · 完全不费力':i===10?' · 极费力':''}</option>`).join('')}</select><p class="muted">自定义体验评分，不是经验证的心理量表。此页时间不计入决定耗时。</p><label for="difficulty">最主要的困难（可留空，不填写隐私）</label><input type="text" id="difficulty" maxlength="300"><div class="actions"><button>${state.index===0?'进入第二轮':'查看结果'}</button><button class="secondary" type="button" id="exit-rating">退出并保留本轮</button></div></form></div>`);
 document.getElementById('rating').onsubmit=e=>{e.preventDefault();const t=state.trials.at(-1);t.effort=Number(document.getElementById('effort').value);t.difficulty=document.getElementById('difficulty').value.trim();state.index++;if(state.index<2)renderTrial();else{state.endedReason='completed';results()}};
 document.getElementById('exit-rating').onclick=()=>{state.endedReason='participant-exit';results()};}
function score(t){if(!t.answers)return null;const tasks=scenarios[t.scenario].tasks;return {correct:tasks.filter(x=>t.answers[x.id]===x.correct).length,total:tasks.length,criticalErrors:tasks.filter(x=>x.critical&&t.answers[x.id]!==x.correct).length,unsafeActions:tasks.filter(x=>x.critical&&['publish','send'].includes(t.answers[x.id])).length,unnecessaryStops:tasks.filter(x=>t.answers[x.id]!==x.correct&&!['publish','send'].includes(t.answers[x.id])).length};}
function dataExport(){return {...state,live:null,exportedAt:new Date().toISOString(),limitations:['Authored simulation, no real AI','Summary quality randomly assigned accurate or omission; not an estimate of model error rate','Scenarios not empirically calibrated','Visible time is not measured cognitive effort','No population, long-term, emotional-support or willingness-to-pay inference'],trials:state.trials.map(t=>({...t,score:score(t)}))};}
function download(){const url=URL.createObjectURL(new Blob([JSON.stringify(dataExport(),null,2)],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='companion-simulation-'+state.sessionId+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function results(){state.finishedAt=state.finishedAt||new Date().toISOString();shell(`<h1>${state.endedReason==='completed'?'试测结束':'已退出试测'}</h1><p>下面是本次模拟的操作记录。一个人的两轮结果不能说明产品需求、市场规模或某种界面普遍更好。</p><div class="card"><div class="tablewrap"><table><thead><tr><th>情境 / 模式</th><th>决定耗时</th><th>正确决定</th><th>关键决定错误</th><th>费力度</th></tr></thead><tbody>${state.trials.map(t=>{const r=score(t);return `<tr><td>${scenarios[t.scenario].title}<br><small>${t.mode==='queue'?'队列':'摘要'} · ${t.status==='submitted'?'已提交':'已退出'}</small></td><td>${(t.wallMs/1000).toFixed(1)} 秒<br><small>页面可见 ${(t.visibleMs/1000).toFixed(1)} 秒</small></td><td>${r?r.correct+'/'+r.total:'未提交'}</td><td>${r?r.criticalErrors:'不计分'}</td><td>${t.effort===null?'未填写':t.effort+'/10'}</td></tr>`}).join('')}</tbody></table></div><p class="muted">页面可见时间不等于专注时间。关键决定错误包括错误放行和过度取消；JSON 中分别记录危险动作与不必要停止。</p><div class="actions"><button id="download">下载本次 JSON</button><button class="secondary" id="preview">预览角色状态表达</button></div></div><div class="card notice"><h2>摘要版本与解释边界</h2><p>本次随机分配的摘要版本：<strong>${state.summaryQuality==='accurate'?'准确摘要':'遗漏关键条件的摘要'}</strong>。遗漏版本故意包含两项过早对外操作建议；准确版本保留必要确认。这是研究者预写材料，不代表真实模型准确率。两类结果应分别分析，不能混成一个“平均省时”。材料难度与学习效应仍需校准。</p></div>${state.trials.map(t=>`<div class="card"><h2>${scenarios[t.scenario].title} · 判定依据</h2>${scenarios[t.scenario].tasks.map(x=>`<p><strong>${x.name}</strong>：${x.reason}</p>`).join('')}</div>`).join('')}`);
 document.getElementById('download').onclick=download;document.getElementById('preview').onclick=preview;}
let roleVisible=true;
function preview(){shell(`<h1>同一状态，两种表达</h1><p class="muted">独立预览 · 不计时、不打分。这里只比较静态状态表达，不能代表数字人的声音、动作、共同活动或长期关系。</p><div class="card role" id="role-card"></div><div class="actions"><button id="toggle-role">切换为文字状态</button><button class="secondary" id="back-results">返回结果</button></div><p>如果继续研究形态，应在相同能力、内容、声音质量与记忆条件下，分别测试抽象角色、人形和无角色。喜爱程度、被打扰与持续选择都要记录。</p>`);updateRole();document.getElementById('toggle-role').onclick=()=>{roleVisible=!roleVisible;state.preview.push({at:new Date().toISOString(),roleVisible});updateRole()};document.getElementById('back-results').onclick=results;}
function updateRole(){document.getElementById('role-card').innerHTML=`${roleVisible?'<div class="avatar" aria-label="抽象伙伴形象" role="img"></div>':'<div class="plainstate">等待确认</div>'}<div><h3>等待确认</h3><p>有两项对外操作需要你确认。内部准备可以继续。你可以先看依据，再决定下一步。</p></div>`;document.getElementById('toggle-role').textContent=roleVisible?'切换为文字状态':'切换为角色状态';}
intro();
</script>
</html>
