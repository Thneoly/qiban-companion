name: Desktop skeleton
on:
  # Paused at the project owner's request. Re-enable the workflow in GitHub
  # before manually dispatching it; pushes and PRs do not start CI.
  workflow_dispatch:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run check
      - run: npm run verify:docs
      - run: npm run verify:prototype
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm run test:browser
      - run: npm run build:desktop
      - run: npm run build:installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-unsigned-${{ github.sha }}
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
