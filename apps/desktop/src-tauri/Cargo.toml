[package]
name = "companion-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "companion-desktop"

[lib]
name = "companion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
sha2 = "0.10"
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize = "1"
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
futures = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros", "net", "rt"] }
rusqlite.workspace = true
companion-core.workspace = true
companion-storage.workspace = true
# Embedded LAN coordinator (P1-b): the desktop hosts the router in-process.
# Promoted from dev-dependency; pulls lettre+native-tls into the production
# tree (recorded cost in docs/architecture/lan-phone-continuity.md).
companion-coordinator = { path = "../../coordinator" }
axum = "0.8"
tauri-plugin-single-instance = "2"

[dev-dependencies]
# Real-service integration tests: serve the actual memory-service router on
# an ephemeral loopback port (axum comes from the embedded dependency above).
memory-service = { path = "../../memory-service" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Credentials", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
