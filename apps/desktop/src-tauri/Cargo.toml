[package]
name = "companion-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "companion-desktop"

[lib]
name = "companion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize = "1"
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
rusqlite.workspace = true
companion-core.workspace = true
companion-storage.workspace = true
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Credentials", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[dev-dependencies]
companion-coordinator = { path = "../../coordinator" }
axum = "0.8"
