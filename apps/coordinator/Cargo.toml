[package]
name = "companion-coordinator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8"
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
zeroize = "1"
# native-tls uses the Windows certificate store (SChannel) instead of a
# compiled-in Mozilla root set, so enterprise TLS interception and custom
# roots installed on this machine are honored during SMTP handshakes.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
companion-core.workspace = true
companion-storage.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
